services:
  tunescout:
    image: ghcr.io/myth815/tunescout:latest
    container_name: tunescout
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
